server:
  port: 7322

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: seb
    password: 123456

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: your-secret-key-at-least-256-bits-long-for-hs256
  expiration: 86400000
